[project]
name = "den"
version = "0.1.0"
description = "A System One decision model: Qwen3.5-4B-Base + LoRA + pointer head, returning calibrated probabilities over typed options"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flash-linear-attention>=0.4 ; sys_platform == 'linux'",
    "httpx>=0.28.1",
    "huggingface-hub>=1.0",
    "mlx-lm>=0.31.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "numpy>=2",
    "pyarrow>=20",
    "tokenizers>=0.22",
    "torch>=2.8 ; sys_platform == 'linux'",
    "transformers>=5.17",
]

[project.scripts]
den = "den.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""  # flat layout: the package lives at the repo root, like kev/

[tool.mypy]
strict = true
python_version = "3.12"
files = ["den", "scripts", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
exclude = ["den/pins.py", "den/licences.py"]  # pin and licence tables: one source per line

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ANN"]

[[tool.mypy.overrides]]
module = ["unsloth.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: loads the 4B base model (slow; run with `make test-model`)",
    "cuda: needs a CUDA GPU (run on the GPU box with `make test-cuda`)",
]
addopts = "-m 'not model and not cuda'"
pythonpath = [".", "tests"]  # ".": the scripts package

[tool.uv]
default-groups = ["dev", "breadth"]  # breadth: the libraries scripts/breadth.py needs, at the versions Kev built breadth-v1 with

[dependency-groups]
breadth = [
    "pandas==3.0.5",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]
dev = [
    "mypy>=2.4.0",
    "peft>=0.21.2",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "torch>=2.8",
]

[tool.ruff.lint.per-file-ignores]
"den/pins.py" = ["E501"]  # pin tables: one source per line
"den/licences.py" = ["E501"]  # licence table: one source per entry, its evidence quoted whole
